# Manual deployment workflow — GitHub Actions 页面 "Run workflow" 手动触发。
# 生产部署是人为决策：CI 只出镜像（dev 分支→开发镜像，main→编译镜像），不碰服务器。
#
# 镜像选择（image_tag 输入）：
#   dev / dev.<时间戳>     → 开发镜像三件套（dev 分支构建产物）
#   <VERSION>（如 1.0.8） / <VERSION>.<时间戳> / latest → 编译镜像（main 构建）
#   指针 tag（dev/latest/版本号）永远指向该线最新；时间戳 tag 用于精确锁定/回滚。
#
# 回滚：重新触发本 workflow，image_tag 填历史时间戳 tag（Harbor 快照永不覆盖）。
name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - staging
          - production
      image_tag:
        description: 'Image tag: dev / dev.<ts> / <VERSION>[.<ts>] / latest'
        required: true
        default: 'latest'

concurrency:
  group: deploy-${{ github.event.inputs.environment }}
  cancel-in-progress: false   # 部署排队执行，不并发交错 down/up

jobs:
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          REGISTRY: ${{ secrets.HARBOR_REGISTRY }}
          HARBOR_USER: ${{ secrets.HARBOR_USER }}
          HARBOR_PASS: ${{ secrets.HARBOR_PASS }}
          TAG: ${{ github.event.inputs.image_tag }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USERNAME }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"

            # ── 前置检查 ─────────────────────────────────────────────
            # 新服务器引导：无 deploy/.env 时明确报错（否则 compose pull 会去
            # Docker Hub 拉不存在的 deploy-backend 等默认镜像）
            if [ ! -f deploy/.env ]; then
              echo "✗ 缺少 deploy/.env——复制 deploy/.env.example 并填写数据库/路径配置" >&2
              exit 1
            fi

            # ── 拉取部署配置（compose/Caddyfile 等；不影响镜像内容）────
            echo "📥 Pulling deploy config..."
            git pull origin main

            # ── 登录私有仓库 ─────────────────────────────────────────
            echo "$HARBOR_PASS" | docker login "${REGISTRY%%/*}" -u "$HARBOR_USER" --password-stdin

            # ── 指定 tag 拉镜像（image_tag 输入真正生效）──────────────
            # -e 覆盖 .env 中的镜像变量：指针/时间戳 tag 由输入决定
            export BACKEND_IMAGE="$REGISTRY/agent-flow-backend:$TAG"
            export CADDY_IMAGE="$REGISTRY/agent-flow-caddy:$TAG"
            export SANDBOX_IMAGE="$REGISTRY/agent-flow-sandbox:$TAG"
            echo "📥 Pulling images @ $TAG ..."
            docker compose -f deploy/docker-compose.yml pull

            # ── 滚动更新：up -d --wait 等健康（不做 down，消除硬停机窗口）──
            echo "🚀 Starting services (wait for healthy)..."
            docker compose -f deploy/docker-compose.yml up -d --wait

            # ── 本机健康复核（后端 8000 / caddy 80）─────────────────
            echo "⏳ Health checks..."
            for i in $(seq 1 12); do
              curl -sf http://127.0.0.1:8000/health && break
              [ "$i" = 12 ] && { echo "✗ backend 健康检查失败" >&2; exit 1; }
              sleep 5
            done
            curl -sf http://127.0.0.1/ > /dev/null || { echo "✗ caddy 健康检查失败" >&2; exit 1; }

            # ── 健康通过才清理悬空层（保留带 tag 的旧版本镜像，可随时回滚）──
            echo "🧹 Pruning dangling layers..."
            docker image prune -f

            echo "✅ Deployment complete @ $TAG"
            docker compose -f deploy/docker-compose.yml ps
