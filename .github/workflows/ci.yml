# CI Pipeline — 分支驱动的镜像构建体系
#   push dev  → 门禁全绿 → 开发镜像三件套（agent-flow-{backend,caddy,sandbox}，源码）
#                → tag: dev.<时间戳>（快照，回滚/复现用）+ dev（指针，环境文件写它即最新）
#   push main → 门禁全绿 → 编译镜像 agent-flow-app（Cython .so + license 强制）
#                → tag: <VERSION>.<时间戳> + <VERSION> + latest（正式线指针）
#   pull_request → 仅门禁，不构建镜像
#
# 私有仓库：secrets 配 HARBOR_REGISTRY（如 harbor.corp.local/agent-flow）、
# HARBOR_USER、HARBOR_PASS。版本号来源：仓库根 VERSION 文件（发版前提交 bump）。
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + type + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check (mypy)
        run: uv run mypy app

      - name: Test (pytest)
        run: uv run pytest -q -m "not integration"

  # 交付物门禁：两个真正打进镜像的前端（旧 frontend/ 包已废弃，不再门禁）
  frontend-studio:
    name: Frontend Studio (tsc + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-studio

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-studio/package-lock.json

      - name: Install dependencies
        run: npm ci --registry=https://registry.npmmirror.com

      - name: Type check (tsc)
        run: npm run lint

      - name: Build
        run: npm run build

  frontend-client:
    name: Frontend Client (tsc + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-client

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-client/package-lock.json

      - name: Install dependencies
        run: npm ci --registry=https://registry.npmmirror.com

      - name: Type check (tsc)
        run: npm run lint

      - name: Build
        run: npm run build

  harness:
    name: Harness (lint + type + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/packages/harness

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python 3.12
        run: uv python install 3.12

      # Install against harness's own lockfile → a clean venv without app-layer
      # deps, so guards like test_no_app_layer_imports_leak stay meaningful.
      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check (mypy)
        run: uv run mypy src

      - name: Test (pytest)
        run: uv run pytest -q

  # dev 分支：开发镜像三件套（源码 .py，license 不强制，dev/test 环境消费）
  dev-images:
    name: Dev images (backend/caddy/sandbox → :dev)
    runs-on: ubuntu-latest
    needs: [backend, frontend-studio, frontend-client, harness]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USER }}
          password: ${{ secrets.HARBOR_PASS }}

      - name: Build and push dev images
        env:
          DOCKER_USER: ${{ secrets.HARBOR_USER }}
          DOCKER_PASS: ${{ secrets.HARBOR_PASS }}
        run: |
          release/build_image.sh deploy dev \
            --registry "${{ secrets.HARBOR_REGISTRY }}" --push

  # main 分支：编译镜像（Cython .so + license 强制；版本号 = 仓库根 VERSION 文件）
  release-image:
    name: Release image (agent-flow-app → :VERSION)
    runs-on: ubuntu-latest
    needs: [backend, frontend-studio, frontend-client, harness]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read VERSION
        id: ver
        run: echo "version=$(cat VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      # 编译管线依赖：Node（前端）+ Python3.12/cython/setuptools（.so）+ uv（依赖导出）+ zip
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install uv + Python 3.12
        uses: astral-sh/setup-uv@v4

      - name: Install build toolchain
        run: |
          uv python install 3.12
          uv run --python 3.12 --with cython --with setuptools python -c "import Cython; print('cython', Cython.__version__)"
          sudo apt-get update -qq && sudo apt-get install -y -qq zip unzip patchelf

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USER }}
          password: ${{ secrets.HARBOR_PASS }}

      - name: Build release package (.so, license enforced)
        run: bash release/build_package.sh "${{ steps.ver.outputs.version }}" --release

      - name: Build and push app image
        env:
          DOCKER_USER: ${{ secrets.HARBOR_USER }}
          DOCKER_PASS: ${{ secrets.HARBOR_PASS }}
        run: |
          release/build_image.sh app "${{ steps.ver.outputs.version }}" \
            --registry "${{ secrets.HARBOR_REGISTRY }}" --push --latest
