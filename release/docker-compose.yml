# Agent Flow（.so 包）容器编排——与源项目 deploy/docker-compose.yml 同构：
# caddy（唯一对外 80/443）+ app/worker/beat（复用同一镜像）+ 数据库。
#
# 用法（推荐经启动器，也可直接 docker compose）：
#   ./agent-flow start --docker        # 自动构建镜像并启动（APP_VERSION 可选）
#   APP_VERSION=1.0.1 docker compose -f docker-compose.yml up -d --build
#
# 镜像 tag：由 APP_VERSION 控制（默认 latest），三个 service 锚点复用同一 tag，
# 升级时不必改本文件——只需构建时传新版本号。
# APP_IMAGE 整体覆盖（私有仓库形态如 harbor.corp/af/agent-flow-app:1.0.8）；
# 未设时维持本地镜像名 agent-flow-app:<APP_VERSION 或 latest>
x-app-image: &app-image ${APP_IMAGE:-agent-flow-app:${APP_VERSION:-latest}}

# 容器内数据路径（覆盖 env_file 中的相对路径）
# license 绑机标识（物理网卡 + /sys 只读挂载）：容器内经挂载点读宿主
# /sys/class/net，"物理网卡优先"选卡——与手动部署直读宿主拿到同一块
# 网卡、同一个 MAC，与启动方式无关。不再注入 AGENT_FLOW_MAC（env 可
# 伪造）；该变量仍保留为手动覆盖项（设错会留 mismatch 审计日志）。
# 必须整挂 /sys：device 符号链接（物理网卡判据）相对路径指向
# /sys/devices/，只挂 class/net 子树会解析失败、全部误判为虚拟。
x-sys-net-env: &sys-net-env
  LICENSE_SYS_NET_PATH: /host-sys/class/net
x-sys-net-vol: &sys-net-vol "/sys:/host-sys:ro"
# 容器内文件路径（Docker 部署特有；手动模式不需要这些变量）
# 宿主机路径等其余配置均由 env 文件提供，不在此覆盖
x-data-env: &data-env
  WORKSPACES_CONTAINER_DIR: /opt/agent-flow/data/workspaces
  SKILLS_CONTAINER_DIR: /opt/agent-flow/data/skills
  HOMES_CONTAINER_DIR: /opt/agent-flow/data/homes
  KB_CONTAINER_DIR: /opt/agent-flow/data/knowledge_bases
  AVATARS_CONTAINER_DIR: /opt/agent-flow/data/avatars
  SKILL_AVATARS_CONTAINER_DIR: /opt/agent-flow/data/skill_avatars

# license：容器内固定路径（宿主 etc/ 目录整个挂入，见 volumes）。
# 必须 rw：网页激活向导的 install API 要写入 jasper.identity。
# 连接串 docker 默认值：手动 compose（未带任何 env）也能连上内置库；
# env 文件/启动器导出的值优先生效（自定义外部库不受影响）
x-conn-env: &conn-env
  MONGODB_URI: ${MONGODB_URI:-mongodb://agentflow:changeme@mongodb:27017/agent_flow?authSource=admin&replicaSet=rs0}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
  QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}

x-license-env: &license-env
  # 固定容器内路径，不受宿主 env 文件里的相对/绝对路径影响
  LICENSE_PATH: /opt/agent-flow/etc/jasper.identity

services:
  caddy:
    image: caddy:2-alpine
    container_name: agent-flow-caddy
    ports:
      # 宿主端口经 HTTP_PORT（etc/agent-flow.env）配置，改端口只改 env；
      # 勿手改本文件——upgrade 会用新模板还原，手改的端口会丢
      - "${HTTP_PORT:-80}:80"   # 对外：caddy 收口；https 由 caddy 自动，
      - "443:443"               #  有域名时 Caddyfile 站点地址改域名即可签证书
    volumes:
      - ./web:/srv/web:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${AF_DATA_DIR:-./data}/caddy:/data
      - ${AF_DATA_DIR:-./data}/caddy-config:/config
    depends_on:
      - app
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
      tags: ["${APP_IMAGE:-agent-flow-app:${APP_VERSION:-latest}}"]
    image: *app-image
    container_name: agent-flow-app
    expose:
      - "8000"  # 仅 docker 网络内（caddy 通过 app:8000 访问）
    env_file:
      - ./etc/agent-flow.env
    environment:
      <<: [*data-env, *license-env, *sys-net-env]
    volumes:
      - ./data:/opt/agent-flow/data
      # etc 整目录挂入（rw）：license 装入后落盘宿主 etc/jasper.identity，
      # 升级换容器/切手动部署，授权都在
      - ./etc:/opt/agent-flow/etc
      - /var/run/docker.sock:/var/run/docker.sock
      # 宿主网卡信息只读挂入（license 绑机指纹，见文件头 x-sys-net 说明）
      - *sys-net-vol
    depends_on:
      mongodb:
        condition: service_healthy   # 等 RS 就绪（启动事务探测 fail-closed）
      redis:
        condition: service_started
    restart: unless-stopped

  worker:
    image: *app-image
    container_name: agent-flow-worker
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    env_file:
      - ./etc/agent-flow.env
    environment:
      <<: [*data-env, *license-env, *sys-net-env]
    volumes:
      - ./data:/opt/agent-flow/data
      - ./etc:/opt/agent-flow/etc
      - /var/run/docker.sock:/var/run/docker.sock
      # 宿主网卡信息只读挂入（license 绑机指纹，见文件头 x-sys-net 说明）
      - *sys-net-vol
    depends_on:
      app:
        condition: service_started
      mongodb:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  beat:
    image: *app-image
    container_name: agent-flow-beat
    command: ["celery", "-A", "app.workers.celery_app", "beat", "--loglevel=info"]
    env_file:
      - ./etc/agent-flow.env
    environment:
      <<: [*data-env, *license-env, *sys-net-env]
    volumes:
      - ./data:/opt/agent-flow/data
      - ./etc:/opt/agent-flow/etc
      - /var/run/docker.sock:/var/run/docker.sock
      # 宿主网卡信息只读挂入（license 绑机指纹，见文件头 x-sys-net 说明）
      - *sys-net-vol
    depends_on:
      - mongodb
      - redis
    restart: unless-stopped

  mongodb:
    # 单节点副本集（#64 E0）：执行域多文档事务要求 RS 形态。
    # - keyFile 为 auth + replSet 强制组合；首次部署生成：
    #     mkdir -p etc && openssl rand -base64 756 | tr -d '\n' > etc/mongo-keyfile
    #     chmod 400 etc/mongo-keyfile
    # - rs.initiate 由 mongo-rs-init 一次性服务完成（幂等）。
    # - MONGODB_URI 需带 &replicaSet=rs0（etc/agent-flow.env 模板已更新）。
    image: ${MONGO_IMAGE:-mongo:7.0}
    container_name: agent-flow-mongodb
    command: ["mongod", "--replSet", "rs0", "--keyFile", "/etc/mongo-keyfile", "--bind_ip_all"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-agentflow}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-changeme}
    volumes:
      - ${AF_DATA_DIR:-./data}/mongodb:/data/db
      - ${AF_ETC_DIR:-./etc}/mongo-keyfile:/etc/mongo-keyfile:ro
    healthcheck:
      # 副本集就绪探针：app/worker 的启动事务探测依赖 RS 已初始化。
      test: ["CMD-SHELL", "mongosh --quiet -u $${MONGO_INITDB_ROOT_USERNAME} -p $${MONGO_INITDB_ROOT_PASSWORD} --authenticationDatabase admin --eval 'try { rs.status().ok } catch (e) { quit(1) }'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"  # 本机工具用（mongosh 等）

  # 一次性：rs.initiate（已初始化则跳过）。
  mongo-rs-init:
    image: ${MONGO_IMAGE:-mongo:7.0}
    restart: "no"
    depends_on:
      - mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-agentflow}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-changeme}
    entrypoint:
      - bash
      - -c
      - |
        for i in $$(seq 1 60); do
          if mongosh "mongodb://$${MONGO_INITDB_ROOT_USERNAME}:$${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017/admin" --quiet --eval \
            'try { rs.status().ok } catch (e) { rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "mongodb:27017" }] }).ok }' \
            | grep -q '^1'; then
            echo "[mongo-rs-init] replica set ready"; exit 0
          fi
          echo "[mongo-rs-init] waiting for mongod ($$i/60)"; sleep 2
        done
        echo "[mongo-rs-init] FAILED to initiate replica set"; exit 1

  redis:
    image: redis:7-alpine
    container_name: agent-flow-redis
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - ${AF_DATA_DIR:-./data}/redis:/data
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"

  qdrant:
    image: qdrant/qdrant:v1.13.2
    container_name: agent-flow-qdrant
    volumes:
      - ${AF_DATA_DIR:-./data}/qdrant:/qdrant/storage
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"

