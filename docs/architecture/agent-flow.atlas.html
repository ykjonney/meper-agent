<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #030711; --panel: #0a1120; --panel-2: #0d1526; --line: #16213a;
    --ink: #e2e8f0; --muted: #64748b; --faint: #334155; --brand: #38bdf8;
    --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Noto Sans Mono CJK SC', 'PingFang SC', monospace;
  }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; display: flex; flex-direction: column; overflow: hidden; }

  /* ── 顶栏 ── */
  header { display: flex; align-items: center; gap: 14px; padding: 0 20px; height: 52px; border-bottom: 1px solid var(--line); background: linear-gradient(180deg, #0a1322, #060d1a); flex-shrink: 0; }
  .brand { display: flex; align-items: center; gap: 9px; white-space: nowrap; }
  .brand .mark { width: 22px; height: 22px; border-radius: 6px; background: conic-gradient(from 210deg, #38bdf8, #818cf8, #34d399, #38bdf8); box-shadow: 0 0 12px rgba(56, 189, 248, .35); }

  .brand .sub { font-size: 11px; color: var(--muted); margin-left: 2px; letter-spacing: -0.01em; }
  #crumbs { display: flex; align-items: center; gap: 6px; font-size: 12px; overflow-x: auto; white-space: nowrap; flex: 1; min-width: 0; scrollbar-width: none; }
  #crumbs::-webkit-scrollbar { display: none; }
  .crumb { color: var(--muted); cursor: pointer; padding: 4px 10px; border-radius: 7px; border: 1px solid transparent; transition: all .15s; }
  .crumb:hover { color: var(--ink); border-color: var(--line); background: var(--panel-2); }
  .crumb.cur { color: #f1f5f9; font-weight: 600; cursor: default; background: color-mix(in srgb, var(--brand) 10%, transparent); border-color: color-mix(in srgb, var(--brand) 25%, transparent); }
  .csep { color: var(--faint); font-size: 11px; }
  #back { font-size: 12px; padding: 5px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); color: #cbd5e1; cursor: pointer; transition: all .15s; flex-shrink: 0; }
  #back:hover:not(:disabled) { border-color: color-mix(in srgb, var(--brand) 45%, var(--line)); color: #f1f5f9; box-shadow: 0 0 10px rgba(56, 189, 248, .15); }
  #back:disabled { opacity: .3; cursor: default; }

  /* ── 主区 ── */
  #main { flex: 1; display: flex; min-height: 0; }
  #stageWrap { flex: 1; overflow: auto; position: relative; background: var(--bg); }

    color: var(--kc); background: color-mix(in srgb, var(--kc) 12%, transparent); border: 1px solid color-mix(in srgb, var(--kc) 26%, transparent); }

  .node .kd { margin-left: auto; flex-shrink: 0; font-family: var(--mono); font-size: 8px; letter-spacing: .14em; text-transform: uppercase; color: color-mix(in srgb, var(--kc) 75%, #94a3b8); }

  .node .dz { position: absolute; right: 9px; bottom: 8px; display: flex; align-items: center; justify-content: center; width: 18px; height: 18px; border-radius: 6px;
    color: var(--kc); background: color-mix(in srgb, var(--kc) 14%, transparent); opacity: .85; }
  .node .dz svg { width: 10px; height: 10px; }
  .node.drill { cursor: pointer; }

    box-shadow: 0 0 0 1px color-mix(in srgb, var(--kc) 30%, transparent), 0 0 20px color-mix(in srgb, var(--kc) 22%, transparent); }
  .node.drill:hover .nm { color: #fff; }

  /* ── 细节面板 ── */
  #side { width: 348px; border-left: 1px solid var(--line); background: var(--panel); overflow-y: auto; padding: 18px; flex-shrink: 0; }
  #side::-webkit-scrollbar { width: 8px; } #side::-webkit-scrollbar-thumb { background: #1c2942; border-radius: 4px; }
  #side h3 { font-size: 13px; font-weight: 650; letter-spacing: -0.015em; color: #f1f5f9; }
  #side .lsub { font-size: 10px; color: var(--muted); margin: 2px 0 14px; font-family: var(--mono); }
  #side .sect { font-size: 9px; color: var(--muted); font-weight: 700; margin: 16px 0 8px; text-transform: uppercase; letter-spacing: .14em; display: flex; align-items: center; gap: 6px; }

  #side .file { display: flex; align-items: center; gap: 7px; font-family: var(--mono); font-size: 10px; color: #7dd3fc; padding: 5px 9px; margin: 3px 0; border-radius: 7px; background: rgba(56,189,248,.06); border: 1px solid rgba(56,189,248,.14); word-break: break-all; }
  #side .fn { padding: 8px 10px; margin: 4px 0; border-radius: 9px; background: var(--panel-2); border: 1px solid var(--line); transition: border-color .15s; }
  #side .fn:hover { border-color: #26375a; }
  #side .fn .hd { display: flex; align-items: baseline; gap: 8px; }
  #side .fn .nm { font-family: var(--mono); font-size: 11px; font-weight: 600; color: #e2e8f0; letter-spacing: -0.01em; word-break: break-all; }
  #side .fn .fl { font-family: var(--mono); font-size: 9.5px; color: #7dd3fc; opacity: .85; margin-top: 3px; word-break: break-all; }
  #side .fn .ds { font-size: 10.5px; color: #8b99ad; line-height: 1.5; margin-top: 4px; }
  #side .empty { font-size: 11px; color: var(--faint); font-style: italic; padding: 8px 0; }
  #side .hint { margin-top: 16px; font-size: 9.5px; color: var(--faint); line-height: 1.6; font-family: var(--mono); }
  @media (max-width: 960px) { #side { display: none; } }

  /* ── 图例 ── */
  .legend { display: flex; gap: 14px; padding: 8px 20px; border-top: 1px solid var(--line); background: #060d1a; font-size: 10px; color: var(--muted); flex-shrink: 0; align-items: center; }
  .legend .it { display: inline-flex; align-items: center; gap: 5px; font-family: var(--mono); }
  .legend .dot { width: 8px; height: 8px; border-radius: 3px; box-shadow: 0 0 6px color-mix(in srgb, currentColor 60%, transparent); }
  .legend .tip { margin-left: auto; color: var(--faint); }
  .legend .tip b { color: #7d8aa0; font-weight: 600; }
</style>

    ' L' + (mx - r) + ',' + y1 +
    ' Q' + mx + ',' + y1 + ' ' + mx + ',' + (y1 + sy * r) +
    ' L' + mx + ',' + (y2 - sy * r) +
    ' Q' + mx + ',' + y2 + ' ' + (mx + r) + ',' + y2 +
    ' L' + (x2 - 6) + ',' + y2;
}

function renderCrumbs() {
  crumbs.innerHTML = '';
  stack.forEach((lid, i) => {
    const l = ATLAS.layers[lid];
    const s = document.createElement('span');
    s.className = 'crumb' + (i === stack.length - 1 ? ' cur' : '');
    s.textContent = l.title || lid;
    if (i < stack.length - 1) s.onclick = () => { stack = stack.slice(0, i + 1); render(); };
    crumbs.appendChild(s);
    if (i < stack.length - 1) {
      const sep = document.createElement('span'); sep.className = 'csep'; sep.textContent = '›';
      crumbs.appendChild(sep);
    }
  });
  backBtn.disabled = stack.length === 1;
}

function renderSide() {
  const d = cur().details;
  if (!d) {
    side.innerHTML = '<h3>' + esc(cur().title) + '</h3><div class="lsub">DETAILS</div>' +
      '<div class="empty">本层无细节面板</div>' +
      '<div class="hint">点击带 ⤷ 角标的模块进入其内部世界\nEsc / 面包屑可返回外层</div>';
    return;
  }
  let h = '<h3>' + esc(cur().title) + '</h3><div class="lsub">DETAILS</div>';
  if (d.summary) h += '<div class="sect">说明</div><div class="dsum">' + esc(d.summary) + '</div>';
  if (d.files?.length) {
    h += '<div class="sect">关键文件</div>';
    for (const f of d.files) h += '<div class="file">' + esc(f) + '</div>';
  }
  if (d.functions?.length) {
    h += '<div class="sect">关键函数</div>';
    for (const fn of d.functions) {
      h += '<div class="fn"><div class="hd"><span class="nm">' + esc(fn.name) + '</span></div>' +
           (fn.file ? '<div class="fl">' + esc(fn.file) + '</div>' : '') +
           (fn.desc ? '<div class="ds">' + esc(fn.desc) + '</div>' : '') + '</div>';
    }
  }
  h += '<div class="hint">file:line 来自代码库实读</div>';
  side.innerHTML = h;
}

function render() {
  const layer = cur();
  stage.innerHTML = '';
  stage.setAttribute('width', layer.w);
  stage.setAttribute('height', layer.h);
  stage.setAttribute('viewBox', '0 0 ' + layer.w + ' ' + layer.h);

  const defs = el('defs', {}, stage);
  /* 点阵网格底 */
  const pat = el('pattern', { id: 'dots', width: 26, height: 26, patternUnits: 'userSpaceOnUse' }, defs);
  el('circle', { cx: 1.2, cy: 1.2, r: 1, fill: '#13203a' }, pat);
  const mk = el('marker', { id: 'arr', viewBox: '0 0 10 10', refX: 8.5, refY: 5, markerWidth: 7.5, markerHeight: 7.5, orient: 'auto-start-reverse' }, defs);
  el('path', { d: 'M0,1.5 L9,5 L0,8.5 z', fill: 'context-stroke' }, mk);

  el('rect', { width: layer.w, height: layer.h, fill: 'url(#dots)' }, stage);
  const g = el('g', {}, stage);
  /* 重启容器入场动画（层切换时） */
  const box = document.getElementById('stageBox');
  box.classList.remove('anim'); void box.offsetWidth; box.classList.add('anim');

  /* 连线（先线后框） */
  for (const e of layer.edges ?? []) {
    const a = layer.pos[e.from], b = layer.pos[e.to];
    if (!a || !b) continue;
    const kc = ATLAS.kindColor[(layer.nodes.find(n => n.id === e.from) || {}).kind] || '#94a3b8';
    const x1 = a.x + BOX_W, y1 = a.y + BOX_H / 2, x2 = b.x, y2 = b.y + BOX_H / 2;
    const grp = el('g', {}, g);
    el('path', { d: orthPath(x1, y1, x2, y2), fill: 'none', stroke: hexA(kc, .42), 'stroke-width': 1.5, 'marker-end': 'url(#arr)' }, grp);
    if (e.label) {
      const t = el('text', { 'font-family': 'JetBrains Mono, ui-monospace, Menlo, monospace', 'font-size': 9.5, fill: '#7d8aa0', 'text-anchor': 'middle' }, grp);
      t.textContent = e.label;
      const mx = (x1 + x2) / 2, my = (Math.abs(y1 - y2) < 1 ? y1 : (y1 + y2) / 2) - 14;
      t.setAttribute('x', mx); t.setAttribute('y', my + 3);
      t.setAttribute('paint-order', 'stroke'); t.setAttribute('stroke', '#070d1a'); t.setAttribute('stroke-width', 4);
      const wpx = t.getComputedTextLength() + 14;
      el('rect', { x: mx - wpx / 2, y: my - 7.5, width: wpx, height: 15, rx: 7.5, fill: '#0a1322', stroke: hexA(kc, .25), 'stroke-width': 1 }, grp);
      grp.appendChild(t);
    }
  }

  /* 节点框 */
  for (const n of layer.nodes ?? []) {
    const p = layer.pos[n.id];
    const kc = ATLAS.kindColor[n.kind] || '#94a3b8';
    const fo = el('foreignObject', { x: p.x + 3, y: p.y + 3, width: BOX_W - 6, height: BOX_H - 6 }, g);
    const div = document.createElement('div');
    div.className = 'node' + (n.child ? ' drill' : '');
    div.style.setProperty('--kc', kc);
    div.innerHTML =
      '<div class="top"><span class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + (ATLAS.kindIcon[n.kind] || '') + '</svg></span>' +
      '<span class="nm">' + esc(n.label) + '</span>' +
      '<span class="kd">' + esc(ATLAS.kindLabel[n.kind] || n.kind || '') + '</span></div>' +
      (n.summary ? '<div class="sm">' + esc(n.summary) + '</div>' : '<div class="sm" style="opacity:.35">—</div>') +
      (n.child ? '<span class="dz"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg></span>' : '');
    fo.appendChild(div);
    /* SVG 原生点击热区：foreignObject 内部对 CDP 命中检测/可访问性树不可达，
       热区 rect 让节点可被自动化点击、键盘聚焦（Enter 下钻）。 */
    if (n.child) {
      const drill = () => { stack.push(n.child); render(); wrap.scrollTo(0, 0); };
      const hit = el('rect', {
        class: 'node-hit', 'data-drill': n.child, 'aria-label': n.label,
        x: p.x + 3, y: p.y + 3, width: BOX_W - 6, height: BOX_H - 6, rx: 12,
        fill: 'transparent', tabindex: 0, role: 'button',
      }, g);
      hit.addEventListener('click', drill);
      hit.addEventListener('keydown', (ev) => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); drill(); } });
    }
  }

  renderCrumbs();
  renderSide();
}

function up() { if (stack.length > 1) { stack.pop(); render(); } }
backBtn.onclick = up;
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') up(); });

/* 图例（按图内实际出现的 kind） */
const used = new Set();
for (const l of Object.values(ATLAS.layers)) for (const n of l.nodes ?? []) used.add(n.kind);
const legend = document.getElementById('legend');
for (const k of used) {
  const it = document.createElement('span');
  it.className = 'it';
  const c = ATLAS.kindColor[k] || '#94a3b8';
  it.innerHTML = '<span class="dot" style="color:' + c + '; background:' + c + '"></span>' + esc(ATLAS.kindLabel[k] || k);
  legend.appendChild(it);
}
const tip = document.createElement('span');
tip.className = 'tip';
tip.innerHTML = '<b>⤷</b> 可下钻 · <b>Esc</b> 返回';
legend.appendChild(tip);

render();
</script>
</body>
</html>
